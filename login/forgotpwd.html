<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeroBot Signup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/login-style.css">
</head>
<body>
  <div class="main-outer forgot-pwd-container">
    <div class="wrapper">
      <header class="header">
        <img src="images/logo.png"  class="logo">
      </header>
      </div>
        <main class="container">

        <section class="right">
          <div class="card">
            <div class="form-top-area">
              <img src="./images/forgotpwd-icon.svg" alt="lock" />
              <h2 class="forgot">Forgot Password?</h2>
              <p class="sub">No worries, we'll send you reset instructions. Enter the email associated with your account.</p>
            </div>
            <form>


             <label>EMAIL ADDRESS</label>
              <div class="input-box">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="name@company.com">
              </div>

              <button class="btn" type="submit">Send Reset Link</button>

              <div class="login">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
              </div>
            </form>

            
          </div>
            <p class="text-below-form">SECURED BY HEROBOT SHIELD</p>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-links">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
          <a href="#">Help Center</a>
        </div>
        <p class="footer-copy">© 2026 HEROBOT. ALL RIGHTS RESERVED.</p>
      </footer>
  </div>

</body>
</html>
